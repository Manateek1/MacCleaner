name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Tests on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run core checks
        run: ./script/run_core_checks.sh
        timeout-minutes: 5
      - name: Build and test
        run: >-
          xcodebuild -project MacCleaner.xcodeproj -scheme MacCleaner
          -configuration Test -destination 'platform=macOS'
          -derivedDataPath build/DerivedData
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGN_IDENTITY=- test
      - name: Run Xcode static analyzer
        run: >-
          xcodebuild -project MacCleaner.xcodeproj -scheme MacCleaner
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build/AnalyzeData
          CODE_SIGN_IDENTITY=- analyze
      - name: Save failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 3
